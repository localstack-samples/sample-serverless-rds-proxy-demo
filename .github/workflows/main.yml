name: Create Infra on LocalStack

on:
  push:
    paths-ignore:
      - 'README.md'
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # “At 00:00 on Sunday.”
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  serverless:
    name: Setup infrastructure using Serverless Framework
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Setup Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Setup SAM
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Setup SAM-Local 
        run: |
          pip install aws-sam-cli-local
          samlocal --help
      
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version
      
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install jq -y

      - name: Install dependencies
        run: |
          make install

      - name: Start LocalStack
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          DNS_ADDRESS: 0
        run: |
          docker pull localstack/localstack-pro:latest
          # Start LocalStack in the background
          LS_LOG=trace LOCALSTACK_AUTH_TOKEN=$LOCALSTACK_AUTH_TOKEN localstack start -d
          # Wait 30 seconds for the LocalStack container to become ready before timing out
          echo "Waiting for LocalStack startup..."
          localstack wait -t 15
          echo "Startup complete"

      - name: Deploy the application
        run: |
          make deploy
          
      - name: Check deployed resources
        run: |
          sleep 20
          samlocal list stack-outputs --stack-name sam-app --region us-east-1  --output json

      - name: Run integration tests
        run: |
          set -euo pipefail
          api_id=$(samlocal list stack-outputs --stack-name sam-app --region us-east-1 --output json \
            | jq -r '.[] | select(.OutputKey=="ApiBasePath") | .OutputValue' \
            | sed -E 's#https?://##; s#\..*##')
          base="https://${api_id}.execute-api.localhost.localstack.cloud:4566"
          echo "API base: $base"

          for path in /no-proxy /proxy; do
            echo "GET $path"
            body=$(curl -fsS --retry 5 --retry-delay 3 --retry-connrefused "${base}${path}")
            echo "  -> $body"
            echo "$body" | grep -q PostgreSQL || { echo "::error::$path did not return a PostgreSQL row"; exit 1; }
          done

      - name: Send a Slack notification
        if: failure() || github.event_name != 'pull_request'
        uses: ravsamhq/notify-slack-action@v2
        with:
          status: ${{ job.status }}
          token: ${{ secrets.GITHUB_TOKEN }}
          notification_title: "{workflow} has {status_message}"
          message_format: "{emoji} *{workflow}* {status_message} in <{repo_url}|{repo}>"
          footer: "Linked Repo <{repo_url}|{repo}> | <{run_url}|View Workflow run>"
          notify_when: "failure"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Generate a Diagnostic Report
        if: failure()
        run: |
          curl -s localhost:4566/_localstack/diagnose | gzip -cf > diagnose.json.gz

      - name: Upload the Diagnostic Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose.json.gz
          path: ./diagnose.json.gz
